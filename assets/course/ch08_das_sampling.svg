<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="690" viewBox="0 0 1200 690">
<rect width="1200" height="690" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs><style>.h{font:bold 34px Arial;fill:#172554}.t{font:bold 23px Arial;fill:#172554}.s{font:20px Arial;fill:#334155}.a{stroke:#2563eb;stroke-width:5;marker-end:url(#a)}</style>
<text x="600" y="52" text-anchor="middle" class="h">Data availability sampling makes withholding detectable</text>
<rect x="55" y="130" width="230" height="190" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="170" y="185" text-anchor="middle" class="t">Original block</text><text x="170" y="225" text-anchor="middle" class="s">k data shares</text><text x="170" y="260" text-anchor="middle" class="s">transactions</text><text x="170" y="290" text-anchor="middle" class="s">and metadata</text>
<rect x="375" y="110" width="300" height="230" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="525" y="155" text-anchor="middle" class="t">Erasure-coded shares</text>
<g fill="#86efac" stroke="#15803d" stroke-width="2"><rect x="420" y="180" width="46" height="46"/><rect x="472" y="180" width="46" height="46"/><rect x="524" y="180" width="46" height="46"/><rect x="576" y="180" width="46" height="46"/><rect x="420" y="232" width="46" height="46"/><rect x="472" y="232" width="46" height="46"/><rect x="524" y="232" width="46" height="46"/><rect x="576" y="232" width="46" height="46"/></g><text x="525" y="315" text-anchor="middle" class="s">reconstruct from a threshold</text>
<rect x="780" y="130" width="365" height="190" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="4"/><text x="962" y="180" text-anchor="middle" class="t">Independent light clients</text><text x="962" y="220" text-anchor="middle" class="s">request random positions</text><text x="962" y="255" text-anchor="middle" class="s">verify commitment proofs</text><text x="962" y="290" text-anchor="middle" class="s">reject missing or invalid shares</text>
<path d="M295 225H360M685 225H765" class="a"/>
<rect x="150" y="440" width="900" height="145" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/><text x="600" y="487" text-anchor="middle" class="t">Withholding enough data to prevent reconstruction hides many samples</text><text x="600" y="528" text-anchor="middle" class="s">If the hidden fraction is h, s independent samples all miss it with probability (1 − h)ˢ.</text><text x="600" y="562" text-anchor="middle" class="s">Peer diversity and unpredictable sampling are part of the security assumption.</text>
</svg>
