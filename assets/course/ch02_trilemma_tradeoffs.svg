<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><title>Measurable blockchain trilemma trade-offs</title><desc>A comparison diagram relates scalability, decentralization, and security to measurable resources and design costs.</desc>
<rect width="1200" height="760" fill="white"/><style>.h{font:bold 34px Arial;fill:#172554}.t{font:bold 25px Arial;fill:#172554}.s{font:20px Arial;fill:#334155}.w{font:bold 23px Arial;fill:white}.edge{stroke:#64748b;stroke-width:7;fill:none}.node{stroke-width:4}</style>
<text x="600" y="52" text-anchor="middle" class="h">Scaling changes resource and trust trade-offs</text>
<path d="M600 155 L255 525 L945 525 Z" class="edge"/>
<circle cx="600" cy="155" r="105" fill="#2563eb" stroke="#1d4ed8" class="node"/><text x="600" y="150" text-anchor="middle" class="w">Scalability</text><text x="600" y="182" text-anchor="middle" class="w">and capacity</text>
<circle cx="255" cy="525" r="105" fill="#16a34a" stroke="#15803d" class="node"/><text x="255" y="520" text-anchor="middle" class="w">Independent</text><text x="255" y="552" text-anchor="middle" class="w">participation</text>
<circle cx="945" cy="525" r="105" fill="#7c3aed" stroke="#6d28d9" class="node"/><text x="945" y="520" text-anchor="middle" class="w">Adversarial</text><text x="945" y="552" text-anchor="middle" class="w">security</text>
<rect x="430" y="350" width="340" height="130" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/><text x="600" y="390" text-anchor="middle" class="t">Evaluate the mechanism</text><text x="600" y="426" text-anchor="middle" class="s">Which work became cheaper?</text><text x="600" y="458" text-anchor="middle" class="s">Which assumption or cost moved?</text>
<text x="600" y="700" text-anchor="middle" class="s">The trilemma is a measurement lens, not a theorem that a system may choose only two vertices.</text>
</svg>
