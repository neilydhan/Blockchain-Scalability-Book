<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650"><rect width="1200" height="650" fill="white"/><style>.h{font:bold 34px Arial;fill:#172554}.t{font:26px Arial;fill:#1e293b}.s{font:22px Arial;fill:#475569}.q{font:bold 26px Arial;fill:white}.a{stroke:#2563eb;stroke-width:5;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#2563eb"/></marker></defs><text x="600" y="55" text-anchor="middle" class="h">Leader-based BFT consensus: normal path</text><rect x="60" y="170" width="220" height="140" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="170" y="230" text-anchor="middle" class="t">Leader proposes</text><text x="170" y="272" text-anchor="middle" class="s">block + parent QC</text><rect x="365" y="170" width="220" height="140" rx="22" fill="#e0e7ff" stroke="#4f46e5" stroke-width="4"/><text x="475" y="230" text-anchor="middle" class="t">Replicas verify</text><text x="475" y="272" text-anchor="middle" class="s">and vote</text><rect x="670" y="170" width="220" height="140" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="780" y="230" text-anchor="middle" class="t">Votes aggregate</text><text x="780" y="272" text-anchor="middle" class="s">quorum certificate</text><rect x="975" y="170" width="170" height="140" rx="22" fill="#1e3a8a"/><text x="1060" y="250" text-anchor="middle" class="q">Commit rule</text><path d="M285 240L350 240" class="a"/><path d="M590 240L655 240" class="a"/><path d="M895 240L960 240" class="a"/><rect x="210" y="420" width="780" height="120" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/><text x="600" y="470" text-anchor="middle" class="t">Timeout or faulty leader → view change and a new leader</text><text x="600" y="512" text-anchor="middle" class="s">Safety depends on locking/QC rules; liveness depends on the pacemaker.</text></svg>
