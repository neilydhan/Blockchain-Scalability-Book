<rect x="820" y="80" width="300" height="160" rx="22" fill="#ffedd5" stroke="#ea580c" stroke-width="4"/><text x="970" y="135" text-anchor="middle" class="t">Sidechain</text><text x="970" y="178" text-anchor="middle" class="s">separate consensus</text><text x="970" y="212" text-anchor="middle" class="s">bridge connection</text>
