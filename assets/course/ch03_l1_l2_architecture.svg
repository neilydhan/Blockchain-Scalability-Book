<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620">
<rect width="1200" height="620" fill="white"/><style>.t{font:28px Arial;fill:#172554}.h{font:bold 34px Arial;fill:white}.s{font:23px Arial;fill:#334155}.a{stroke:#2563eb;stroke-width:5;fill:none;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs>
<rect x="90" y="390" width="1020" height="150" rx="24" fill="#1e3a8a"/><text x="600" y="440" text-anchor="middle" class="h">Layer 1: consensus, data availability, settlement</text><text x="600" y="490" text-anchor="middle" class="h">and native execution</text>
<rect x="80" y="80" width="300" height="160" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="230" y="135" text-anchor="middle" class="t">State channel</text><text x="230" y="178" text-anchor="middle" class="s">signed updates</text><text x="230" y="212" text-anchor="middle" class="s">disputes on L1</text>
