<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="730" viewBox="0 0 1200 730">
<rect width="1200" height="730" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker><marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#dc2626"/></marker></defs><style>.h{font:bold 34px Arial;fill:#172554}.t{font:bold 22px Arial;fill:#172554}.s{font:19px Arial;fill:#334155}.w{font:bold 21px Arial;fill:white}.a{stroke:#2563eb;stroke-width:5;marker-end:url(#a);fill:none}.r{stroke:#dc2626;stroke-width:5;marker-end:url(#r);fill:none}</style>
<text x="600" y="52" text-anchor="middle" class="h">A state channel moves repeated updates off-chain</text>
<rect x="65" y="150" width="235" height="170" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="183" y="198" text-anchor="middle" class="t">1. Open on L1</text><text x="183" y="240" text-anchor="middle" class="s">lock assets</text><text x="183" y="273" text-anchor="middle" class="s">define participants</text><text x="183" y="306" text-anchor="middle" class="s">set dispute rules</text>
<rect x="410" y="115" width="380" height="240" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="600" y="160" text-anchor="middle" class="t">2. Exchange signed states</text><rect x="462" y="195" width="276" height="50" rx="12" fill="#16a34a"/><text x="600" y="228" text-anchor="middle" class="w">state 7: nonce + balances</text><rect x="462" y="270" width="276" height="50" rx="12" fill="#15803d"/><text x="600" y="303" text-anchor="middle" class="w">state 8: newer signatures</text>
<rect x="900" y="150" width="235" height="170" rx="22" fill="#ede9fe" stroke="#7c3aed" stroke-width="4"/><text x="1018" y="198" text-anchor="middle" class="t">3. Settle on L1</text><text x="1018" y="240" text-anchor="middle" class="s">cooperative close</text><text x="1018" y="273" text-anchor="middle" class="s">or dispute</text><text x="1018" y="306" text-anchor="middle" class="s">latest valid state wins</text>
<path d="M315 235H395" class="a"/><path d="M805 235H885" class="a"/>
<rect x="210" y="460" width="780" height="165" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/><text x="600" y="507" text-anchor="middle" class="t">Dispute path</text><text x="600" y="548" text-anchor="middle" class="s">A party posts a signed state. The counterparty has a bounded window</text><text x="600" y="580" text-anchor="middle" class="s">to submit a newer nonce before the contract releases funds.</text><path d="M880 460C850 390 800 370 735 355" class="r"/>
<text x="600" y="682" text-anchor="middle" class="s">Security depends on authenticated state, monotonic nonces, monitoring, and affordable L1 access.</text>
</svg>
