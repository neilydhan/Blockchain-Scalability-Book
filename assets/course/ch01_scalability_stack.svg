<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720"><title>Four functions behind blockchain scalability</title><desc>A vertical flow connects execution, settlement, consensus, and data availability, with notes contrasting one monolithic validator set with specialized modular systems.</desc><rect width="1200" height="720" fill="white"/><style>.h{font:bold 34px Arial;fill:#172554}.t{font:27px Arial;fill:white}.s{font:23px Arial;fill:#334155}.a{stroke:#64748b;stroke-width:4;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#64748b"/></marker></defs><text x="600" y="55" text-anchor="middle" class="h">Four functions behind blockchain scalability</text><rect x="420" y="100" width="360" height="105" rx="20" fill="#2563eb"/><text x="600" y="165" text-anchor="middle" class="t">Execution: compute state</text><rect x="420" y="250" width="360" height="105" rx="20" fill="#16a34a"/><text x="600" y="315" text-anchor="middle" class="t">Settlement: accept state</text><rect x="420" y="400" width="360" height="105" rx="20" fill="#7c3aed"/><text x="600" y="465" text-anchor="middle" class="t">Consensus: order and finalize</text><rect x="420" y="550" width="360" height="105" rx="20" fill="#ea580c"/><text x="600" y="615" text-anchor="middle" class="t">Data availability: publish inputs</text><path d="M600 210L600 238" class="a"/><path d="M600 360L600 388" class="a"/><path d="M600 510L600 538" class="a"/><text x="170" y="175" class="s">Monolithic chain:</text><text x="170" y="215" class="s">one validator set</text><text x="170" y="255" class="s">performs all four</text><text x="840" y="340" class="s">Modular stack:</text><text x="840" y="380" class="s">separate systems</text><text x="840" y="420" class="s">specialize by function</text></svg>
