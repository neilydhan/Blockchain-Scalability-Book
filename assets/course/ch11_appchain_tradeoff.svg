<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620"><rect width="1200" height="620" fill="white"/><style>.h{font:bold 34px Arial;fill:#172554}.t{font:27px Arial;fill:#1e293b}.s{font:22px Arial;fill:#475569}.a{stroke:#334155;stroke-width:5;marker-end:url(#m)}</style><defs><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0L0,6L9,3z" fill="#334155"/></marker></defs><text x="600" y="55" text-anchor="middle" class="h">From shared blockspace to an application chain</text><rect x="70" y="150" width="420" height="300" rx="25" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="280" y="210" text-anchor="middle" class="h">Shared rollup</text><text x="280" y="270" text-anchor="middle" class="t">shared sequencer and fees</text><text x="280" y="320" text-anchor="middle" class="t">synchronous local composability</text><text x="280" y="370" text-anchor="middle" class="t">congestion shared with other apps</text><rect x="710" y="150" width="420" height="300" rx="25" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="920" y="210" text-anchor="middle" class="h">Appchain</text><text x="920" y="270" text-anchor="middle" class="t">custom execution and fees</text><text x="920" y="320" text-anchor="middle" class="t">dedicated blockspace</text><text x="920" y="370" text-anchor="middle" class="t">bridges and fragmented liquidity</text><path d="M505 300 L690 300" class="a"/><text x="600" y="270" text-anchor="middle" class="s">specialize</text><text x="600" y="520" text-anchor="middle" class="t">The gain is control. The cost is another security and interoperability boundary.</text></svg>
