<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs><style>.h{font:bold 34px Arial;fill:#172554}.t{font:bold 22px Arial;fill:#172554}.s{font:18px Arial;fill:#334155}.w{font:bold 19px Arial;fill:white}.a{stroke:#2563eb;stroke-width:5;marker-end:url(#a);fill:none}</style>
<text x="600" y="52" text-anchor="middle" class="h">A modular transaction crosses explicit trust boundaries</text>
<g><rect x="45" y="150" width="205" height="155" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="148" y="192" text-anchor="middle" class="t">Execution</text><text x="148" y="230" text-anchor="middle" class="s">compute state</text><text x="148" y="260" text-anchor="middle" class="s">emit commitment</text></g>
<g><rect x="350" y="150" width="205" height="155" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="453" y="192" text-anchor="middle" class="t">Data availability</text><text x="453" y="230" text-anchor="middle" class="s">publish inputs</text><text x="453" y="260" text-anchor="middle" class="s">support recovery</text></g>
<g><rect x="655" y="150" width="205" height="155" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><text x="758" y="192" text-anchor="middle" class="t">Settlement</text><text x="758" y="230" text-anchor="middle" class="s">verify proof</text><text x="758" y="260" text-anchor="middle" class="s">accept state root</text></g>
<g><rect x="960" y="150" width="195" height="155" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="4"/><text x="1058" y="192" text-anchor="middle" class="t">Destination</text><text x="1058" y="230" text-anchor="middle" class="s">verify message</text><text x="1058" y="260" text-anchor="middle" class="s">apply once</text></g>
<g stroke="#2563eb" stroke-width="5" fill="#2563eb"><path d="M265 228H335"/><path d="M570 228H640"/><path d="M875 228H945"/><path d="M335 228l-12 -8v16z"/><path d="M640 228l-12 -8v16z"/><path d="M945 228l-12 -8v16z"/></g>
<rect x="125" y="405" width="950" height="200" rx="22" fill="#f8fafc" stroke="#64748b" stroke-width="4"/><text x="600" y="448" text-anchor="middle" class="t">One envelope binds the interfaces</text><rect x="230" y="478" width="740" height="54" rx="12" fill="#334155"/><text x="600" y="512" text-anchor="middle" class="w">source • destination • nonce • payload hash • state root • proof • expiry</text><text x="600" y="566" text-anchor="middle" class="s">Relayers carry evidence but do not define truth. Reorganizations and unavailable data delay acceptance.</text>
<text x="600" y="672" text-anchor="middle" class="s">End-to-end safety is the composition of every verifier; end-to-end liveness is limited by the slowest required service.</text>
</svg>
