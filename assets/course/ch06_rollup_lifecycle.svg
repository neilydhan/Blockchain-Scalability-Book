<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><title>Rollup transaction completion boundaries</title><desc>Five boxes separate submission, sequencing, data publication, proving or challenge, and settlement, with a note that wallets should name the boundary they report.</desc>
<rect width="1200" height="660" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs><style>.h{font:bold 34px Arial;fill:#172554}.t{font:bold 23px Arial;fill:#172554}.s{font:20px Arial;fill:#334155}.n{font:bold 24px Arial;fill:white}.a{stroke:#2563eb;stroke-width:5;marker-end:url(#a)}</style>
<text x="600" y="52" text-anchor="middle" class="h">A rollup transaction has several completion boundaries</text>
<g><rect x="45" y="155" width="185" height="150" rx="20" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><circle cx="78" cy="185" r="20" fill="#2563eb"/><text x="78" y="193" text-anchor="middle" class="n">1</text><text x="138" y="225" text-anchor="middle" class="t">Submit</text><text x="138" y="260" text-anchor="middle" class="s">signed transaction</text></g>
<g><rect x="275" y="155" width="185" height="150" rx="20" fill="#e0e7ff" stroke="#4f46e5" stroke-width="4"/><circle cx="308" cy="185" r="20" fill="#4f46e5"/><text x="308" y="193" text-anchor="middle" class="n">2</text><text x="368" y="225" text-anchor="middle" class="t">Sequence</text><text x="368" y="260" text-anchor="middle" class="s">order and execute</text></g>
<g><rect x="505" y="155" width="185" height="150" rx="20" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><circle cx="538" cy="185" r="20" fill="#16a34a"/><text x="538" y="193" text-anchor="middle" class="n">3</text><text x="598" y="225" text-anchor="middle" class="t">Publish data</text><text x="598" y="252" text-anchor="middle" class="s">make state</text><text x="598" y="282" text-anchor="middle" class="s">recoverable</text></g>
<g><rect x="735" y="155" width="185" height="150" rx="20" fill="#fef3c7" stroke="#d97706" stroke-width="4"/><circle cx="768" cy="185" r="20" fill="#d97706"/><text x="768" y="193" text-anchor="middle" class="n">4</text><text x="828" y="225" text-anchor="middle" class="t">Prove</text><text x="828" y="260" text-anchor="middle" class="s">fault or validity path</text></g>
<g><rect x="965" y="155" width="190" height="150" rx="20" fill="#ede9fe" stroke="#7c3aed" stroke-width="4"/><circle cx="998" cy="185" r="20" fill="#7c3aed"/><text x="998" y="193" text-anchor="middle" class="n">5</text><text x="1060" y="225" text-anchor="middle" class="t">Settle</text><text x="1060" y="260" text-anchor="middle" class="s">L1 finality</text></g>
<g stroke="#2563eb" stroke-width="5" fill="#2563eb"><path d="M235 230H260"/><path d="M465 230H490"/><path d="M695 230H720"/><path d="M925 230H950"/><path d="M260 230l-12 -8v16z"/><path d="M490 230l-12 -8v16z"/><path d="M720 230l-12 -8v16z"/><path d="M950 230l-12 -8v16z"/></g>
<rect x="125" y="405" width="950" height="150" rx="22" fill="#f8fafc" stroke="#64748b" stroke-width="3"/><text x="600" y="455" text-anchor="middle" class="t">Wallet status should name the boundary</text><text x="600" y="495" text-anchor="middle" class="s">Sequencer acceptance is fast but provisional. Data publication enables recovery.</text><text x="600" y="530" text-anchor="middle" class="s">Proof acceptance and settlement finality support higher-value actions.</text>
</svg>
