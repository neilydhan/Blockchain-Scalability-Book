<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720">
<rect width="1200" height="720" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs><style>.h{font:bold 34px Arial;fill:#172554}.t{font:bold 22px Arial;fill:#172554}.s{font:19px Arial;fill:#334155}.w{font:bold 20px Arial;fill:white}.a{stroke:#2563eb;stroke-width:5;marker-end:url(#a)}.d{stroke:#dc2626;stroke-width:4;stroke-dasharray:10 8}</style>
<text x="600" y="52" text-anchor="middle" class="h">Parallel execution preserves one canonical result</text>
<rect x="55" y="135" width="230" height="390" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="170" y="180" text-anchor="middle" class="t">Ordered block</text>
<g><rect x="92" y="215" width="155" height="58" rx="12" fill="#2563eb"/><text x="170" y="251" text-anchor="middle" class="w">T1: write A</text><rect x="92" y="290" width="155" height="58" rx="12" fill="#4f46e5"/><text x="170" y="326" text-anchor="middle" class="w">T2: write B</text><rect x="92" y="365" width="155" height="58" rx="12" fill="#dc2626"/><text x="170" y="401" text-anchor="middle" class="w">T3: read A</text><rect x="92" y="440" width="155" height="58" rx="12" fill="#7c3aed"/><text x="170" y="476" text-anchor="middle" class="w">T4: write C</text></g>
<rect x="385" y="135" width="365" height="390" rx="22" fill="#f8fafc" stroke="#64748b" stroke-width="4"/><text x="568" y="180" text-anchor="middle" class="t">Scheduler and workers</text><text x="568" y="212" text-anchor="middle" class="s">execute independent state in parallel</text>
<rect x="430" y="255" width="115" height="150" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="3"/><text x="488" y="294" text-anchor="middle" class="t">Worker 1</text><text x="488" y="337" text-anchor="middle" class="s">T1</text><text x="488" y="372" text-anchor="middle" class="s">then T3</text>
<rect x="590" y="255" width="115" height="150" rx="16" fill="#ede9fe" stroke="#7c3aed" stroke-width="3"/><text x="648" y="294" text-anchor="middle" class="t">Worker 2</text><text x="648" y="337" text-anchor="middle" class="s">T2</text><text x="648" y="372" text-anchor="middle" class="s">and T4</text>
<path d="M430 425H545" class="d"/><text x="568" y="465" text-anchor="middle" class="s">T3 waits or retries after T1</text>
<rect x="850" y="135" width="295" height="390" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/><text x="998" y="180" text-anchor="middle" class="t">Deterministic commit</text><text x="998" y="220" text-anchor="middle" class="s">validate reads</text><text x="998" y="255" text-anchor="middle" class="s">resolve conflicts</text><text x="998" y="290" text-anchor="middle" class="s">apply canonical order</text><rect x="905" y="345" width="185" height="95" rx="16" fill="#ea580c"/><text x="998" y="385" text-anchor="middle" class="w">same state root</text><text x="998" y="417" text-anchor="middle" class="w">on every node</text>
<path d="M300 330H370" class="a"/><path d="M765 330H835" class="a"/>
<rect x="175" y="590" width="850" height="80" rx="18" fill="#fef2f2" stroke="#dc2626" stroke-width="3"/><text x="600" y="624" text-anchor="middle" class="t">Speedup depends on independence</text><text x="600" y="654" text-anchor="middle" class="s">Hot state creates waits and retries; serial commitment bounds total acceleration.</text>
</svg>
