<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">Arbitrum Nitro and ZKsync Era transaction traces</title>
<desc id="desc">Two parallel original flow diagrams compare optimistic dispute resolution with validity proof verification.</desc>
<rect width="1200" height="650" fill="#f8fafc"/>
<style>.h{font:700 30px Arial,sans-serif;fill:#102a43}.t{font:600 21px Arial,sans-serif;fill:#102a43}.s{font:17px Arial,sans-serif;fill:#334e68}.a{fill:#e6f0ff;stroke:#3973ac;stroke-width:2}.z{fill:#e9f8ef;stroke:#27864f;stroke-width:2}.e{fill:#fff4dd;stroke:#b7791f;stroke-width:2}.line{stroke:#486581;stroke-width:3;fill:none}</style>
<defs><marker id="m" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#486581"/></marker></defs>
<text x="300" y="48" text-anchor="middle" class="h">Arbitrum Nitro / BoLD</text><text x="900" y="48" text-anchor="middle" class="h">ZKsync Era</text>
<g class="a"><rect x="90" y="85" width="420" height="72" rx="12"/><rect x="90" y="192" width="420" height="72" rx="12"/><rect x="90" y="299" width="420" height="72" rx="12"/><rect x="90" y="406" width="420" height="72" rx="12"/><rect x="90" y="513" width="420" height="72" rx="12"/></g>
<g class="z"><rect x="690" y="85" width="420" height="72" rx="12"/><rect x="690" y="192" width="420" height="72" rx="12"/><rect x="690" y="299" width="420" height="72" rx="12"/><rect x="690" y="406" width="420" height="72" rx="12"/><rect x="690" y="513" width="420" height="72" rx="12"/></g>
<g class="t" text-anchor="middle"><text x="300" y="118">Sequencer orders and executes</text><text x="300" y="225">Batch data reaches Ethereum</text><text x="300" y="332">Validator posts state assertion</text><text x="300" y="439">BoLD challenge window</text><text x="300" y="546">Assertion confirmed; withdrawal</text><text x="900" y="118">EraVM executes transaction</text><text x="900" y="225">Operator commits L1 batch</text><text x="900" y="332">Prover builds validity proof</text><text x="900" y="439">Ethereum verifies proof</text><text x="900" y="546">Batch executes; withdrawal</text></g>
<g class="s" text-anchor="middle"><text x="300" y="143">fast soft confirmation</text><text x="300" y="250">blob or calldata</text><text x="300" y="357">replay against canonical inbox</text><text x="300" y="464">false claim can be rejected</text><text x="300" y="571">bridge consumes message</text><text x="900" y="143">L2 receipt</text><text x="900" y="250">data and state commitment</text><text x="900" y="357">witness satisfies circuit</text><text x="900" y="464">invalid proof is rejected</text><text x="900" y="571">bridge consumes message</text></g>
<g class="line"><path d="M300 157V190"/><path d="M300 264V297"/><path d="M300 371V404"/><path d="M300 478V511"/><path d="M900 157V190"/><path d="M900 264V297"/><path d="M900 371V404"/><path d="M900 478V511"/></g>
<text x="600" y="625" text-anchor="middle" class="s">Both paths also depend on available data, safe bridge contracts, Ethereum finality, and controlled upgrades.</text>
</svg>
