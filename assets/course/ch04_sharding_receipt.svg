<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><title>Cross-shard receipt lifecycle</title><desc>A source shard debits state and emits an authenticated receipt that a destination shard verifies and consumes once before producing an acknowledgement.</desc>
<rect width="1200" height="720" fill="white"/><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2563eb"/></marker></defs><style>.h{font:bold 34px Arial;fill:#172554}.t{font:bold 22px Arial;fill:#172554}.s{font:19px Arial;fill:#334155}.w{font:bold 20px Arial;fill:white}.a{stroke:#2563eb;stroke-width:5;marker-end:url(#a);fill:none}.g{stroke:#16a34a;stroke-width:4;fill:none}</style>
<text x="600" y="52" text-anchor="middle" class="h">A cross-shard transfer is an authenticated message</text>
<rect x="55" y="135" width="310" height="350" rx="22" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/><text x="210" y="180" text-anchor="middle" class="t">Source shard A</text><rect x="105" y="220" width="210" height="64" rx="13" fill="#2563eb"/><text x="210" y="260" text-anchor="middle" class="w">1. debit sender</text><rect x="105" y="315" width="210" height="64" rx="13" fill="#4f46e5"/><text x="210" y="355" text-anchor="middle" class="w">2. emit receipt</text><text x="210" y="420" text-anchor="middle" class="s">commit receipt root</text><text x="210" y="452" text-anchor="middle" class="s">under source finality</text>
<rect x="445" y="195" width="310" height="230" rx="22" fill="#fff7ed" stroke="#ea580c" stroke-width="4"/><text x="600" y="240" text-anchor="middle" class="t">Receipt and proof</text><text x="600" y="282" text-anchor="middle" class="s">source shard + destination</text><text x="600" y="316" text-anchor="middle" class="s">asset + amount + nonce</text><text x="600" y="350" text-anchor="middle" class="s">inclusion + finality evidence</text><text x="600" y="392" text-anchor="middle" class="s">delivery may be delayed or retried</text>
<rect x="835" y="135" width="310" height="350" rx="22" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/><text x="990" y="180" text-anchor="middle" class="t">Destination shard B</text><rect x="885" y="220" width="210" height="64" rx="13" fill="#16a34a"/><text x="990" y="260" text-anchor="middle" class="w">3. verify proof</text><rect x="885" y="315" width="210" height="64" rx="13" fill="#15803d"/><text x="990" y="355" text-anchor="middle" class="w">4. mark consumed</text><text x="990" y="420" text-anchor="middle" class="s">credit recipient once</text><text x="990" y="452" text-anchor="middle" class="s">or reject invalid receipt</text>
<path d="M380 310H430" class="a"/><path d="M770 310H820" class="a"/>
<rect x="170" y="565" width="860" height="95" rx="18" fill="#f8fafc" stroke="#64748b" stroke-width="3"/><text x="600" y="604" text-anchor="middle" class="t">Protocol invariants</text><text x="600" y="625" text-anchor="middle" class="s">Debit before emit • authenticate both domains • consume each nonce once</text><text x="600" y="651" text-anchor="middle" class="s">Expose timeout and recovery when delivery or destination execution fails</text>
</svg>
